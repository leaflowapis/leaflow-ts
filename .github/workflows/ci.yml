name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate from the pinned contract
        run: |
          rm -rf leaflowapis
          git init --quiet leaflowapis
          git -C leaflowapis remote add origin https://github.com/leaflowapis/leaflowapis.git
          git -C leaflowapis fetch --quiet --depth 1 origin "$(cat CONTRACTS_REF)"
          git -C leaflowapis checkout --quiet --detach FETCH_HEAD
          npm run generate
          git diff --exit-code -- src
          test -z "$(git ls-files --others --exclude-standard -- src)"
      - run: npm run build

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: npm publish --provenance --access public
