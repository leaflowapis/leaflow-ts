# 校验每次推送，发布只在打 tag 时。
#
# # 为什么每次推送也跑
#
# 跑的是「重新生成一遍，看签进来的产物和契约还对不对」加类型检查。它替开发挡住一类改动：
# 契约改了、但生成物没跟着提交——那件事在 review 时发现是重跑一次生成，在发布那天发现是
# 发布中断，而那时候 CI 手上明明有正确的产物。
#
# # CI 不写回生成物
#
# 一个会 commit 回来的流水线，在两次推送挨得近时要处理「我算完了但 main 又变了」，而处理方式
# 无非是重试或者强推——前者会打架，后者会丢东西。所以这里只读不写：产物由开发在本地跑完提交。
#
# # 契约是 submodule，所以 checkout 要带 submodules
#
# 不带的话 leaflowapis/ 是个空目录，生成器会说「一份契约都没有」然后退出——而那个错看起来像
# 契约仓库出了问题。
#
# # 没有 NPM_TOKEN
#
# 发布走 npm 的 trusted publishing（OIDC）：npm 那边登记了「@leaflow/sdk 只接受来自
# LeaflowNET/leaflow-ts 的 ci.yml 的发布」，运行时用 GitHub 签发的 id-token 换一次性凭据。
#
# 所以这个仓库里**一个发布凭据都不存**。那不只是省事：一把长期 token 会过期、会被轮换、
# 会在 fork 的 PR 里被人试图读出来，而这三件事都不报错——它们的表现都是「某天发布突然挂了」
# 或者「某天有人发了一个我们没发的版本」。npm 自己也在收紧 token 发布（CI 日志里那句
# "npm tokens that bypass 2FA are being restricted"）。
#
# `--provenance` 因此不用显式写：trusted publishing 本来就带溯源。
#
# permissions 里的 id-token: write 是这套东西的前提，删了它表现是 ENEEDAUTH。
#
# # 版本号来自 tag，不来自 package.json
#
# 两处各写一遍的话，忘改的那处会让 npm 上出现一个和 tag 对不上的版本，而 npm 不会拒绝，
# 它只是发出去了。
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 生成物是最新的
        run: |
          npm run generate
          if ! git diff --quiet; then
            echo "::error::契约改了但生成物没跟着更新。本地跑一次 npm run generate 再提交。" >&2
            git --no-pager diff --stat >&2
            exit 1
          fi

      - run: npm run typecheck

  # main 上的每次推送发一个 dev 快照。装它要显式写 @dev，`npm i @leaflow/sdk` 拿到的还是正式版。
  #
  # g 前缀让 commit hash 在以数字开头时仍然是合法的 semver 预发布标识；run number 让快照之间
  # 有先后。
  snapshot:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # npm 的 trusted publishing 要 CLI >= 11.5.1，而 setup-node 给的是 Node 自带那一版
      # ——版本不够时它不会说「你的 npm 太老」，而是照常发，然后被 registry 以一句
      # `E404 ... could not be found or you do not have permission` 挡回来。那句话看起来像
      # 包名写错了或者没权限，指不到真正的原因。
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm version "0.0.0-dev.${{ github.run_number }}.g${GITHUB_SHA::7}" --no-git-tag-version
      - run: npm publish --tag dev

  # v1.2.3 → npm 正式版。
  #
  # tag 不再带 ts/ 前缀：这个仓库只有 TS 一种产物，前缀是上一版用来和 go/ 分开的，而那正是
  # 拆仓库要消除的东西。
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # npm 的 trusted publishing 要 CLI >= 11.5.1，而 setup-node 给的是 Node 自带那一版
      # ——版本不够时它不会说「你的 npm 太老」，而是照常发，然后被 registry 以一句
      # `E404 ... could not be found or you do not have permission` 挡回来。那句话看起来像
      # 包名写错了或者没权限，指不到真正的原因。
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: npm publish --access public
