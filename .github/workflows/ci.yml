name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate from the pinned public contract
        run: |
          git clone --no-checkout https://github.com/leaflowapis/leaflowapis.git leaflowapis
          git -C leaflowapis checkout --detach "$(cat CONTRACTS_REF)"
          npm run generate
          git diff --exit-code -- src
          test -z "$(git ls-files --others --exclude-standard -- src)"
      - run: npm run build

  snapshot:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm version "0.0.0-dev.${{ github.run_number }}.g${GITHUB_SHA::7}" --no-git-tag-version
      - run: npm publish --provenance --tag dev

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: npm publish --provenance --access public
